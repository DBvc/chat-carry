<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatCarry · 对话导出</title>
  </head>
  <body>
    <main class="popup" aria-labelledby="app-title">
      <header class="header">
        <div class="app-mark" aria-hidden="true">↗</div>
        <div>
          <h1 id="app-title">ChatCarry</h1>
          <p class="subtitle">把这段对话带走</p>
        </div>
      </header>
      <section class="context" aria-label="当前对话">
        <p class="conversation-title" id="conversation-title">当前对话</p>
        <p class="status" id="status" role="status" aria-live="polite">正在读取…</p>
        <p class="status" id="warning" data-tone="warning" hidden></p>
        <button class="retry" id="retry" type="button" hidden>重试</button>
      </section>
      <div class="actions">
        <button class="action primary" id="copy-button" type="button" disabled>复制纯文本</button>
        <button class="action secondary" id="export-button" type="button" disabled>
          导出 Markdown
        </button>
      </div>
      <div class="manual" id="manual" hidden>
        <label for="manual-text">已选中文字，请按 ⌘C / Ctrl+C 复制</label>
        <textarea id="manual-text" readonly></textarea>
      </div>
      <p class="privacy">本地转换 · 不上传至第三方</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
