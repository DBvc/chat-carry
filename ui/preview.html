<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对话导出 · 交互参考</title>
<style>
:root {
  color-scheme: light dark;
  --surface: #ffffff;
  --surface-soft: #f5f6f8;
  --text: #19212d;
  --muted: #657084;
  --line: #e3e7ed;
  --accent: #315ce8;
  --accent-hover: #254bd0;
  --accent-text: #ffffff;
  --success: #137447;
  --warning: #885412;
  --danger: #b03537;
  --focus: #7495ff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 13px;
  line-height: 1.5;
  font-synthesis: none;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1b1e24;
    --surface-soft: #252932;
    --text: #f0f2f6;
    --muted: #a9b3c4;
    --line: #363d49;
    --accent: #5378ff;
    --accent-hover: #6687ff;
    --success: #79dba8;
    --warning: #eac484;
    --danger: #ffaaaa;
    --focus: #a0b6ff;
  }
}
* { box-sizing: border-box; }
body { width: 336px; margin: 0; background: var(--surface); color: var(--text); }
button, textarea { font: inherit; }
.popup { width: 336px; padding: 20px; }
.header { display: flex; align-items: center; gap: 11px; }
.app-mark { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 11px; color: var(--accent); font-size: 24px; font-weight: 600; }
h1 { font-size: 16px; line-height: 1.4; margin: 0; font-weight: 650; letter-spacing: -0.2px; }
.subtitle { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
.context { margin: 22px 0 18px; min-height: 49px; }
.conversation-title { margin: 0 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.status { margin: 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.status[data-tone="success"] { color: var(--success); }
.status[data-tone="warning"] { color: var(--warning); }
.status[data-tone="error"] { color: var(--danger); }
.actions { display: grid; gap: 10px; }
.action { width: 100%; min-height: 46px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; font-weight: 600; transition: background-color 120ms, border-color 120ms; }
.primary { color: var(--accent-text); background: var(--accent); border-color: var(--accent); }
.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.secondary { color: var(--text); background: var(--surface); }
.secondary:hover:not(:disabled) { background: var(--surface-soft); }
.action:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.privacy { margin: 18px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
.retry { border: 0; padding: 5px 0; margin-top: 5px; background: transparent; color: var(--accent); cursor: pointer; }
.manual { margin-top: 14px; }
.manual label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 12px; }
.manual textarea { display: block; width: 100%; height: 112px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface-soft); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Everything below is the review canvas, not the shipped extension. */
body { width: auto; min-height: 100vh; background: #f1f3f6; }
.review-shell { max-width: 1180px; margin: 0 auto; padding: 42px 40px 30px; }
.review-header { display:flex; justify-content:space-between; align-items:center; color:#667184; gap:16px; }
.kicker { letter-spacing: .13em; font-size:11px; font-weight:700; }
.review-badge { font-size:12px; background:#e6ebf3; border:1px solid #dbe2ed; border-radius:20px; padding:5px 11px; color:#526076; }
.review-layout { display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:70px; align-items:center; min-height:560px; }
.review-intro h2 { font-size:44px; line-height:1.32; letter-spacing:-1.4px; font-weight:650; margin:0 0 22px; color:#182331; }
.review-intro h2 span { color:#315ce8; }
.review-intro p { margin:0; max-width:390px; font-size:15px; line-height:1.85; color:#647084; }
.review-rule { margin-top:34px; padding-top:22px; border-top:1px solid #dce2eb; max-width:360px; }
.review-rule strong { font-size:13px; display:block; color:#2a3547; margin-bottom:6px; }
.review-rule p { font-size:13px; line-height:1.8; }
.device { width:376px; margin:0 auto; }
.browser-bar { height:39px; display:flex; align-items:center; justify-content:flex-end; padding:0 13px; gap:14px; background:#e8edf4; border:1px solid #dbe2ed; border-bottom:0; border-radius:13px 13px 0 0; color:#768398; }
.browser-dot { width:15px; height:15px; border:1.5px solid currentColor; border-radius:4px; }
.active-extension { display:grid; place-items:center; width:28px; height:27px; border-radius:6px; color:#315ce8; background:#d5e0fb; font-size:20px; }
.popup-wrap { display:flex; justify-content:flex-end; padding:10px 9px 0; position:relative; }
.popup { border:1px solid var(--line); border-radius:13px; background:var(--surface); color:var(--text); box-shadow:0 16px 40px #21345616,0 2px 6px #21345609; }
.popup .action svg { width:17px; height:17px; flex:none; }
.figure-caption { margin:17px 0 0; text-align:center; color:#7b8697; font-size:12px; }
.controls { display:flex; align-items:center; flex-wrap:wrap; justify-content:space-between; padding:20px 0; gap:18px; border-top:1px solid #dce2eb; }
.control-group { display:flex; align-items:center; flex-wrap:wrap; gap:10px; color:#647084; }
.control-group label { font-size:12px; }
select, .theme-button { font:inherit; padding:8px 10px; border:1px solid #d1d9e5; border-radius:8px; background:#fff; color:#344154; }
.theme-button { cursor:pointer; }
.review-note { font-size:12px; line-height:1.75; color:#748093; }
html[data-demo-theme="dark"] { color-scheme:dark; --surface:#1b1e24; --surface-soft:#252932; --text:#f0f2f6; --muted:#a9b3c4; --line:#363d49; --accent:#5378ff; --accent-hover:#6687ff; --success:#79dba8; --warning:#eac484; --danger:#ffaaaa; --focus:#a0b6ff; }
html[data-demo-theme="light"] { color-scheme:light; --surface:#fff; --surface-soft:#f5f6f8; --text:#19212d; --muted:#657084; --line:#e3e7ed; --accent:#315ce8; --accent-hover:#254bd0; --success:#137447; --warning:#885412; --danger:#b03537; --focus:#7495ff; }
html[data-demo-theme="dark"] body { background:#11161e; }
html[data-demo-theme="dark"] .review-intro h2 { color:#edf1f8; }
html[data-demo-theme="dark"] .review-intro h2 span { color:#89a2ff; }
html[data-demo-theme="dark"] .review-intro p, html[data-demo-theme="dark"] .review-note { color:#9ba8ba; }
html[data-demo-theme="dark"] .review-rule strong { color:#d8dfeb; }
html[data-demo-theme="dark"] .review-rule, html[data-demo-theme="dark"] .controls { border-color:#2a3444; }
html[data-demo-theme="dark"] .browser-bar { background:#202936; border-color:#344055; }
html[data-demo-theme="dark"] .active-extension { background:#303f66; color:#acbcff; }
html[data-demo-theme="dark"] .review-badge, html[data-demo-theme="dark"] select, html[data-demo-theme="dark"] .theme-button { background:#202936; border-color:#344055; color:#c0cada; }
@media (max-width:820px) { .review-layout { grid-template-columns:1fr; gap:42px; padding:50px 0; } .review-intro h2 {font-size:34px;} .review-shell {padding:24px 20px;} .device {width: min(376px,100%);} .popup-wrap {padding-right:0;} }
</style></head>
<body>
<div class="review-shell">
  <header class="review-header"><div class="kicker">CHATCARRY / 01</div><span class="review-badge">交互参考 · 演示数据</span></header>
  <main class="review-layout">
    <section class="review-intro">
      <h2>复制一段纯文本。<br>留下一份 <span>Markdown。</span></h2>
      <p>不先选择格式，不先研究设置。<br>打开当前对话，点一下，把有用的内容带走。</p>
      <div class="review-rule"><strong>把默认行为做好，不把选择题交给用户。</strong><p>正式弹窗只保留两个主要动作。重试和手动复制，只在确实需要恢复操作时出现。</p></div>
    </section>
    <figure class="device">
      <div class="browser-bar" aria-hidden="true"><span class="browser-dot"></span><span class="active-extension">↗</span><span>⋮</span></div>
      <div class="popup-wrap">
        <section class="popup" aria-labelledby="app-title">
          <header class="header"><div class="app-mark" aria-hidden="true">↗</div><div><h1 id="app-title">ChatCarry</h1><p class="subtitle">把这段对话带走</p></div></header>
          <div class="context"><p class="conversation-title" id="conversation-title" title="如何设计一个可靠而简单的 Chrome 扩展">如何设计一个可靠而简单的 Chrome 扩展</p><p id="status" class="status" role="status" aria-live="polite">ChatGPT · 已读取 12 条消息</p><button id="retry" class="retry" type="button" hidden>重试</button></div>
          <div class="actions">
            <button class="action primary" id="copy-button" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></svg><span>复制纯文本</span></button>
            <button class="action secondary" id="export-button" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span>导出 Markdown</span></button>
          </div>
          <div id="manual" class="manual" hidden><label for="manual-text">已选中文字，请按 ⌘C / Ctrl+C 复制</label><textarea id="manual-text" readonly></textarea></div>
          <p class="privacy">本地转换 · 不上传至第三方</p>
        </section>
      </div>
      <figcaption class="figure-caption">336 px · 正式界面没有下面的演示控制</figcaption>
    </figure>
  </main>
  <section class="controls" aria-label="仅用于设计评审的控制">
    <div class="control-group"><label for="state-select">查看状态</label><select id="state-select"><option value="ready">默认</option><option value="loading">正在读取</option><option value="error">读取失败</option><option value="unsupported">不是已保存会话</option><option value="streaming">正在生成回答</option><option value="warning">包含图片或附件</option><option value="clipboard-error">剪贴板失败</option><option value="download-started">下载已启动</option><option value="download-complete">下载完成</option></select></div>
    <div class="control-group"><label>演示主题</label><button id="theme-button" class="theme-button" type="button">切换深色</button></div>
  </section>
  <p class="review-note">这是可以点按的设计样例，不是 Chrome 扩展，不连接 ChatGPT。复制与导出只使用本页内置的演示文字；无外部请求。浏览器若限制剪贴板，页面会展示手动复制兜底。</p>
</div>
<script>
/* DEMO_ONLY: never ship this file or its fake preparation states in dist/. */
const plain = '演示对话\n\n你：\n如何保持这个扩展简单？\n\nChatGPT：\n固定两个动作：复制纯文本，导出 Markdown。\n';
const markdown = '# 演示对话\n\n## 你\n\n如何保持这个扩展简单？\n\n## ChatGPT\n\n固定两个动作：复制纯文本，导出 Markdown。\n';
const select = document.querySelector('#state-select');
const status = document.querySelector('#status');
const title = document.querySelector('#conversation-title');
const copy = document.querySelector('#copy-button');
const exportButton = document.querySelector('#export-button');
const retry = document.querySelector('#retry');
const manual = document.querySelector('#manual');
const textarea = document.querySelector('#manual-text');
let timer;
let state = 'ready';
function setState(next) {
 clearTimeout(timer); state=next; select.value=next;
 copy.querySelector('span').textContent='复制纯文本'; exportButton.querySelector('span').textContent='导出 Markdown';
 title.textContent='如何设计一个可靠而简单的 Chrome 扩展';
 copy.disabled=false; exportButton.disabled=false; retry.hidden=true; manual.hidden=true; status.dataset.tone='';
 const states={ready:'ChatGPT · 已读取 12 条消息',loading:'正在读取当前对话…',error:'暂时无法读取这段对话，请刷新后重试',unsupported:'请先打开一段已保存的 ChatGPT 对话',streaming:'回答仍在生成，结束后重试',warning:'含图片/附件，仅保留文字和占位说明','clipboard-error':'浏览器未允许复制，请手动复制','download-started':'已交给浏览器下载','download-complete':'Markdown 已下载'};
 status.textContent=states[next];
 if(['loading','error','unsupported','streaming'].includes(next)){copy.disabled=true;exportButton.disabled=true;}
 if(['error','streaming'].includes(next))retry.hidden=false;
 if(next==='error')status.dataset.tone='error';
 if(next==='unsupported')title.textContent='还没有可导出的对话';
 if(next==='warning')status.dataset.tone='warning';
 if(next==='download-complete')status.dataset.tone='success';
 if(next==='clipboard-error'){status.dataset.tone='warning';manual.hidden=false;textarea.value=plain;textarea.focus();textarea.select();}
}
select.addEventListener('change',()=>setState(select.value));
retry.addEventListener('click',()=>{setState('loading');timer=setTimeout(()=>setState('ready'),600);});
copy.addEventListener('click',()=>{
 if(copy.disabled)return;
 if(!navigator.clipboard?.writeText){setState('clipboard-error');return;}
 navigator.clipboard.writeText(plain).then(()=>{status.textContent='演示纯文本已复制';status.dataset.tone='success';copy.querySelector('span').textContent='已复制';timer=setTimeout(()=>setState(state==='warning'?'warning':'ready'),1800);}).catch(()=>setState('clipboard-error'));
});
exportButton.addEventListener('click',()=>{
 const a=document.createElement('a');a.href='data:text/markdown;charset=utf-8,'+encodeURIComponent(markdown);a.download='演示对话.md';document.body.append(a);a.click();a.remove();setState('download-started');
});
let dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
const themeButton=document.querySelector('#theme-button');
function theme(){document.documentElement.dataset.demoTheme=dark?'dark':'light';themeButton.textContent=dark?'切换浅色':'切换深色';}
themeButton.addEventListener('click',()=>{dark=!dark;theme();});theme();
</script></body></html>
